<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="canonical" href="../survey-doctor/">
<!--
  구 주소 보존용 — 내용을 복제하지 않는다.

  왜 있는가: 2026-08-14 에 문진을 「치과 개원의」에서 「개원의」로 범용화하면서 주소를
  /survey-dental/ → /survey-doctor/ 로 옮겼다. 앱 vc199 이하는 옛 주소를 하드코딩해 들고 있고
  (빌드는 됐으나 Play 미업로드), 사이드로드본이나 이미 카톡으로 나간 링크가 있을 수 있다.

  🚨 문진 내용을 여기 복사하지 말 것. 두 벌이 되면 반드시 한쪽만 낡고, 그때 어느 쪽을 본
     원장인지 알 수 없게 된다. 이 파일은 넘겨주기만 한다.

  location.search 를 이어 붙인다 — ?sp=dental 같은 프리필이 리다이렉트에서 사라지면
  안 그래도 조용한 실패였던 진료과 축이 또 조용히 비워진다.
-->
<meta http-equiv="refresh" content="0;url=../survey-doctor/">
<title>개원의 사전 문진 — 주소가 바뀌었습니다</title>
<style>
  body{font-family:-apple-system,'Pretendard','Malgun Gothic','Noto Sans KR',sans-serif;
       background:#F8F7F4;color:#1A1A1A;margin:0;padding:48px 20px;text-align:center;line-height:1.7}
  a{display:inline-block;margin-top:18px;padding:14px 22px;background:#008C8C;color:#fff;
    border-radius:11px;font-weight:700;text-decoration:none;min-height:48px;box-sizing:border-box}
</style>
</head>
<body>
<p>문진 주소가 바뀌었습니다.<br>잠시 후 새 주소로 자동 이동합니다.</p>
<p><a href="../survey-doctor/" id="go">▶ 새 주소로 이동</a></p>
<script>
(function(){
  var to = '../survey-doctor/' + (location.search || '');
  var a = document.getElementById('go');
  if (a) a.href = to;
  location.replace(to);
})();
</script>
</body>
</html>
